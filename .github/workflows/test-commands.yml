name: Test ggGit Commands

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:

jobs:
  test-commands:
    name: Test ggGit Commands
    runs-on: ubuntu-latest
    
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONPATH: src

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.12'
        channels: conda-forge,defaults
        channel-priority: strict
        environment-file: environment.yml
        activate-environment: gggit

    - name: Install dependencies
      run: |
        pip install -r requirements-dev.txt
        
    - name: Setup Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Run health check
      run: bash health-check.sh
      
    - name: Test individual commands help
      run: |
        echo "Testing individual command functionality..."
        for cmd in src/commands/gg*.py; do
          if [ -f "$cmd" ]; then
            echo "Testing python $cmd --help"
            python "$cmd" --help > /dev/null 2>&1 || {
              echo "❌ python $cmd --help failed"
              exit 1
            }
            echo "✅ python $cmd --help passed"
          fi
        done
        
    - name: Test command syntax
      run: |
        echo "Checking script syntax..."
        for script in src/commands/gg*.py; do
          if [ -f "$script" ]; then
            echo "Checking syntax: $(basename "$script")"
            python -m py_compile "$script" || {
              echo "❌ Syntax error in $(basename "$script")"
              exit 1
            }
            echo "✅ $(basename "$script") syntax OK"
          fi
        done
