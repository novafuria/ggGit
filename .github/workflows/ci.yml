name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONPATH: .

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        channels: conda-forge,defaults
        channel-priority: strict
        environment-file: environment.yml
        activate-environment: gggit
    
    - name: Cache conda dependencies
      uses: actions/cache@v4
      with:
        path: ~/.conda/pkgs
        key: ${{ runner.os }}-conda-${{ hashFiles('environment.yml') }}
        restore-keys: |
          ${{ runner.os }}-conda-
    
    - name: Install dependencies
      run: |
        pip install -r requirements-dev.txt
    
    - name: Lint with flake8
      run: |
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check src tests
    
    - name: Check import sorting with isort
      run: |
        isort --check-only src tests
    
    - name: Type check with mypy
      run: |
        mypy src --ignore-missing-imports
    
    - name: Run all tests with coverage
      id: run-tests
      run: |
        pytest tests/ --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing --junitxml=test-results-all.xml --cov-fail-under=80
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          test-results*.xml
          htmlcov/
          coverage.xml
        if-no-files-found: warn

  quality-gates:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONPATH: .

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.12'
        channels: conda-forge,defaults
        channel-priority: strict
        environment-file: environment.yml
        activate-environment: gggit
    
    - name: Install dependencies
      run: |
        pip install -r requirements-dev.txt
    
    - name: Download test results
      id: download-artifact
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: test-results-3.12
        path: test-results/
    
    - name: Parse test results
      if: steps.download-artifact.outcome == 'success'
      run: |
        python -c "
        import xml.etree.ElementTree as ET
        import sys
        
        # Parse test results
        try:
            tree = ET.parse('test-results/test-results-all.xml')
            root = tree.getroot()
            
            tests = int(root.get('tests', 0))
            failures = int(root.get('failures', 0))
            errors = int(root.get('errors', 0))
            
            print(f'Tests: {tests}')
            print(f'Failures: {failures}')
            print(f'Errors: {errors}')
            
            if failures > 0 or errors > 0:
                print('❌ Quality gate failed: Tests have failures or errors')
                sys.exit(1)
            else:
                print('✅ Quality gate passed: All tests passed')
        except Exception as e:
            print(f'❌ Quality gate failed: Could not parse test results: {e}')
            sys.exit(1)
        "
    
    - name: Check coverage threshold
      if: steps.download-artifact.outcome == 'success'
      run: |
        python -c "
        import xml.etree.ElementTree as ET
        import sys
        
        try:
            tree = ET.parse('test-results/coverage.xml')
            root = tree.getroot()
            
            line_rate = float(root.get('line-rate', 0))
            branch_rate = float(root.get('branch-rate', 0))
            
            print(f'Line coverage: {line_rate:.2%}')
            print(f'Branch coverage: {branch_rate:.2%}')
            
            if line_rate < 0.80:
                print('❌ Quality gate failed: Line coverage below 80%')
                sys.exit(1)
            elif branch_rate < 0.60:
                print('❌ Quality gate failed: Branch coverage below 60%')
                sys.exit(1)
            else:
                print('✅ Quality gate passed: Coverage thresholds met')
        except Exception as e:
            print(f'❌ Quality gate failed: Could not parse coverage: {e}')
            sys.exit(1)
        "

  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONPATH: .

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.12'
        channels: conda-forge,defaults
        channel-priority: strict
        environment-file: environment.yml
        activate-environment: gggit
    
    - name: Install dependencies
      run: |
        pip install safety bandit
    
    - name: Security check with safety
      run: |
        safety check --json --output safety-report.json || true
    
    - name: Security check with bandit
      run: |
        bandit -r src -f json -o bandit-report.json || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json

  notify:
    runs-on: ubuntu-latest
    needs: [test, quality-gates, security]
    if: always()
    
    steps:
    - name: Notify on success
      if: needs.test.result == 'success' && needs.quality-gates.result == 'success'
      run: |
        echo "✅ All checks passed successfully!"
    
    - name: Notify on failure
      if: needs.test.result == 'failure' || needs.quality-gates.result == 'failure'
      run: |
        echo "❌ Some checks failed. Please review the logs."
        exit 1
